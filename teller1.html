<!doctype html> 
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>VierVoorSpier — Kerstmarkt teller</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      margin:0;
      font-family:Inter,sans-serif;
      background: url("kerst.jpg") no-repeat center center fixed;
      background-size: cover;
      overflow:hidden;
    }
    header.bar {
      position:fixed;
      top:0; left:0; right:0;
      background:rgba(0,0,0,0.6);
      color:#fff;
      font-weight:700;
      text-align:center;
      padding:12px;
      font-size:1.2em;
      z-index:3;
    }
    canvas#snow {position:fixed; inset:0; z-index:1; pointer-events:none;}
    .wrap {position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;}
    .title {
      font-size:8em;
      font-weight:800;
      margin:80px 0 0;
      color:#000; /* zwart */
    }
    .subtitle {
      margin:0 0 20px;
      font-size:3em;
      color:#000; /* zwart */
    }
    .total {
      font-size:12em;
      font-weight:800;
      color:#ff0000; /* rood */
      text-shadow:0 0 20px rgba(255,0,0,.4);
    }
    .deltas {
      position:fixed;
      top:140px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      z-index:4;
    }
    .deltas span {
      font-size:2em;
      font-weight:700;
      animation: fadeout 1.2s forwards;
    }
    @keyframes fadeout {
      0% {opacity:1; transform:translateY(0);}
      100% {opacity:0; transform:translateY(-20px);}
    }
    .corner {
      position:fixed; bottom:20px; background:rgba(0,0,0,.5); padding:10px; border-radius:12px;
      display:flex; flex-direction:column; align-items:center; gap:6px;
    }
    .corner img {width:120px; height:120px; background:#fff; border-radius:8px;}
    .corner.left {left:20px;}
    .corner.right {right:20px;}
    .corner .label {font-size:14px; color:#fff;}
    .help {
      position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.6); padding:8px 12px; border-radius:8px; font-size:14px; color:#fff;
    }
    .help kbd {background:#fff; color:#000; padding:2px 6px; border-radius:4px;}

    /* Twinkelende lichtjes */
    .light {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffd700; /* goudkleurig */
      animation: twinkle 2s infinite alternate;
      opacity: 0.8;
      z-index:1;
    }
    @keyframes twinkle {
      from { opacity: 0.2; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="bar">Serious Request — ’s‑Hertogenbosch</header>
  <canvas id="snow"></canvas>

  <!-- Twinkelende lichtjes -->
  <div class="light" style="top:20%; left:30%;"></div>
  <div class="light" style="top:40%; left:70%;"></div>
  <div class="light" style="top:60%; left:20%;"></div>
  <div class="light" style="top:80%; left:50%;"></div>
  <div class="light" style="top:25%; left:80%;"></div>
  <div class="light" style="top:70%; left:40%;"></div>

  <div class="wrap">
    <h1 class="title">VierVoorSpier</h1>
    <p class="subtitle">Opbrengst kerstmarkt</p>
    <div id="total" class="total">€ 0</div>
  </div>

  <div id="deltas" class="deltas"></div>

  <div class="corner left">
    <img src="donatie.png" alt="Doneer QR" />
    <div class="label">Doneer</div>
  </div>
  <div class="corner right">
    <img src="instagram.png" alt="Instagram QR" />
    <div class="label">Instagram</div>
  </div>

  <div id="help" class="help">
    <kbd>1</kbd>=€1 <kbd>2</kbd>=€2 <kbd>4</kbd>=€4 <kbd>U</kbd>=Undo <kbd>R</kbd>=Reset <kbd>H</kbd>=Help
  </div>

  <script>
    const fmt = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
    const totalEl=document.getElementById('total');
    const helpEl=document.getElementById('help');
    const deltas=document.getElementById('deltas');
    let total=0, history=[];

    function render(){ totalEl.textContent=fmt.format(total); }
    function add(a){ total+=a; history.push(a); render(); showDelta(`+${fmt.format(a)}`, '#22c55e'); }
    function undo(){ let last=history.pop(); if(last){ total-=last; render(); showDelta(`–${fmt.format(last)}`, '#f59e0b'); } }
    function reset(){ total=0; history=[]; render(); showDelta('Reset', '#fff'); }
    function showDelta(txt,color){
      const span=document.createElement('span');
      span.textContent=txt;
      span.style.color=color;
      deltas.appendChild(span);
      setTimeout(()=>span.remove(),1200);
    }

    window.addEventListener('keydown',e=>{
      let k=e.key.toLowerCase();
      if(k==='1') add(1);
      else if(k==='2') add(2);
      else if(k==='4') add(4);
      else if(k==='u') undo();
      else if(k==='r') reset();
      else if(k==='h') helpEl.style.display=(helpEl.style.display==='none'?'block':'none');
    });
    render();

    // Snow
    (function(){
      const c=document.getElementById('snow'),ctx=c.getContext('2d');
      let W,H,flakes;
      function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;
        flakes=Array.from({length:Math.floor(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,d:Math.random()*1+0.5}));
      }
      function draw(){
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath();
        for(const f of flakes){ctx.moveTo(f.x,f.y);ctx.arc(f.x,f.y,f.r,0,Math.PI*2);}
        ctx.fill(); update(); requestAnimationFrame(draw);
      }
      function update(){for(const f of flakes){f.y+=f.d; if(f.y>H){f.y=-4;f.x=Math.random()*W;}}}
      window.addEventListener('resize',resize); resize(); draw();
    })();
  </script>
</body>
</html>
